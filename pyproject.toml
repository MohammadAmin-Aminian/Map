[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rhum-rum-geospatial-mapper"
version = "0.1.0"
description = "Reproducible RHUM-RUM bathymetry, OBS-network and tectonic-context mapping"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Mohammad Amin Aminian"}]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
  "obspy>=1.4,<2",
  "pygmt>=0.15,<0.19"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1"]

[project.scripts]
rhum-rum-map = "rhum_rum_mapper:main"

[project.urls]
Repository = "https://github.com/MohammadAmin-Aminian/rhum-rum-geospatial-mapper"
Publication = "https://doi.org/10.1093/gji/ggaf253"

[tool.setuptools]
py-modules = ["MAP_RHUM_RUM", "rhum_rum_mapper"]
